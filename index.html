```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cubo Romântico 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff4fa3, #ff85c1, #ffc1dd);
      font-family: 'Arial', sans-serif;
      position: relative;
    }

    /* Fundo animado */
    .background-hearts {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .background-hearts span {
      position: absolute;
      bottom: -50px;
      color: rgba(255,255,255,0.35);
      font-size: 20px;
      animation: subir linear infinite;
    }

    @keyframes subir {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) scale(1.8);
        opacity: 0;
      }
    }

    /* Frases românticas */
    .poema-container {
      position: absolute;
      top: 5%;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      z-index: 3;
    }

    .poema {
      display: inline-block;
      font-size: 2rem;
      color: white;
      font-weight: bold;
      text-shadow: 0 0 15px rgba(255,255,255,0.8);
      padding-left: 100%;
      animation: deslizar 18s linear infinite;
    }

    @keyframes deslizar {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-200%);
      }
    }

    /* Cubo */
    .container {
      perspective: 1000px;
      z-index: 2;
    }

    .CUBO {
      width: 220px;
      height: 220px;
      position: relative;
      transform-style: preserve-3d;
      animation: girar 10s infinite linear;
    }

    .face {
      position: absolute;
      width: 220px;
      height: 220px;
      background-size: cover;
      background-position: center;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 0 25px rgba(255,255,255,0.4);
    }

    .frente { transform: translateZ(110px); }
    .traseira { transform: rotateY(180deg) translateZ(110px); }
    .esquerda { transform: rotateY(-90deg) translateZ(110px); }
    .direita { transform: rotateY(90deg) translateZ(110px); }
    .cima { transform: rotateX(90deg) translateZ(110px); }
    .baixo { transform: rotateX(-90deg) translateZ(110px); }

    @keyframes girar {
      from {
        transform: rotateX(0deg) rotateY(0deg);
      }
      to {
        transform: rotateX(360deg) rotateY(360deg);
      }
    }

    /* Fotos coração pulsando */
    .heart-photo {
      position: absolute;
      width: 120px;
      height: 120px;
      background-size: cover;
      background-position: center;
      clip-path: path('M60 110 L15 65 A25 25 0 1 1 60 30 A25 25 0 1 1 105 65 Z');
      animation: pulsar 2s infinite;
      box-shadow: 0 0 25px rgba(255,255,255,0.5);
      z-index: 2;
    }

    .heart1 { top: 15%; left: 8%; }
    .heart2 { bottom: 15%; right: 8%; }
    .heart3 { top: 65%; left: 12%; }

    @keyframes pulsar {
      0%,100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }

    /* Botão */
    #botao {
      width: 140px;
      position: absolute;
      bottom: 30px;
      cursor: pointer;
      z-index: 3;
      transition: transform 0.3s ease;
    }

    #botao:hover {
      transform: scale(1.15);
    }

    .heart {
      width: 40px;
      height: 40px;
      position: absolute;
      animation: moveHeart 3s ease-out forwards;
      z-index: 4;
    }

    @keyframes moveHeart {
      to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
      }
    }

    .assinatura {
      position: absolute;
      bottom: 10px;
      color: white;
      font-size: 1rem;
      z-index: 3;
      text-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div class="background-hearts"></div>

  <div class="poema-container">
    <div class="poema">
      "Te amo além do tempo, além da vida, além de qualquer universo... você é meu poema favorito." ❤️
    </div>
  </div>

  <div class="heart-photo heart1" style="background-image: url('momo.jpg');"></div>
  <div class="heart-photo heart2" style="background-image: url('momomo.jpg');"></div>
  <div class="heart-photo heart3" style="background-image: url('paixao.jpg');"></div>

  <div class="container">
    <div class="CUBO">
      <div class="face frente" style="background-image: url('momo.jpg');"></div>
      <div class="face traseira" style="background-image: url('nenem.jpg');"></div>
      <div class="face esquerda" style="background-image: url('gatinho.jpg');"></div>
      <div class="face direita" style="background-image: url('paixao.jpg');"></div>
      <div class="face cima" style="background-image: url('momomo.jpg');"></div>
      <div class="face baixo" style="background-image: url('tururu-meu.jpg');"></div>
    </div>
  </div>

  <img src="200w.gif" id="botao" onclick="criarCoracoes()" alt="Botão coração" />

  <div class="assinatura">Feito com amor, porque sofrer por estética é tradição humana.</div>

  <script>
    /* Chuva de corações no fundo */
    const bg = document.querySelector('.background-hearts');

    function criarChuva() {
      const heart = document.createElement('span');
      heart.innerHTML = '❤';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
      heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
      bg.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 10000);
    }

    setInterval(criarChuva, 300);

    /* Explosão de corações */
    function criarCoracoes() {
      const container = document.body;

      for (let i = 0; i < 50; i++) {
        const novoCoracao = document.createElement('img');
        novoCoracao.src = '200w.gif';
        novoCoracao.classList.add('heart');

        const randomX = (Math.random() - 0.5) * 120 + 'vw';
        const randomY = (Math.random() - 0.5) * 120 + 'vh';
        novoCoracao.style.setProperty('--x', randomX);
        novoCoracao.style.setProperty('--y', randomY);

        novoCoracao.style.left = '50%';
        novoCoracao.style.top = '50%';
        novoCoracao.style.transform = 'translate(-50%, -50%)';

        novoCoracao.addEventListener('animationend', () => {
          novoCoracao.remove();
        });

        container.appendChild(novoCoracao);
      }
    }

    /* Clique acelera cubo */
    document.querySelector('.CUBO').addEventListener('click', function() {
      this.style.animation = 'girar 3s infinite linear';
    });
  </script>

</body>
</html>
